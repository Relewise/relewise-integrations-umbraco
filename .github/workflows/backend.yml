name: backend

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        dotnet-version: ["11.0.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Verify namespaces and using directives
        run: dotnet format Relewise.Integrations.Umbraco.slnx --verify-no-changes --diagnostics IDE0005 IDE0065 IDE0130 --severity info

      - name: Test with dotnet
        run: dotnet test Relewise.Integrations.Umbraco.slnx --configuration Debug

  core-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - major: 17
            baseline: "17.0.0"
          - major: 18
            baseline: "18.3.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Test Core on Umbraco ${{ matrix.major }}
        run: >-
          dotnet test src/Integrations.Umbraco.Tests/Integrations.Umbraco.Tests.csproj
          --configuration Release -p:UmbracoMajorVersion=${{ matrix.major }}
      - name: Check published API compatibility
        run: >-
          dotnet pack src/Integrations.Umbraco/Integrations.Umbraco.csproj
          --configuration Release -p:UmbracoMajorVersion=${{ matrix.major }}
          -p:EnablePackageValidation=true -p:PackageValidationBaselineVersion=${{ matrix.baseline }}
