name: publish to NuGet

on:
  release:
    types: [published]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        dotnet-version: ["11.0.x"]
    defaults:
      run:
        working-directory: ./src/Integrations.Umbraco
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v6
      with:
        node-version: "24"

    - name: Setup .NET Core SDK ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v6
      with:
         dotnet-version: |
           10.0.x
           ${{ matrix.dotnet-version }}

    - name: Verify commit exists in origin/main
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main
    - name: Set VERSION variable from tag
      run: |
        VERSION=${GITHUB_REF##*/}
        UMBRACO_MAJOR=${VERSION%%.*}
        case "$UMBRACO_MAJOR" in
          17|18|19) ;;
          *) echo "Unsupported integration major: $UMBRACO_MAJOR"; exit 1 ;;
        esac
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "UMBRACO_MAJOR=$UMBRACO_MAJOR" >> $GITHUB_ENV
    - name: Build tests and dependencies
      run: >-
        dotnet build ../Integrations.Umbraco.Tests/Integrations.Umbraco.Tests.csproj
        --configuration Release /p:Version=${VERSION} /p:UmbracoMajorVersion=${UMBRACO_MAJOR}
    - name: Run tests
      run: >-
        dotnet test ../Integrations.Umbraco.Tests/Integrations.Umbraco.Tests.csproj
        --configuration Release /p:Version=${VERSION} /p:UmbracoMajorVersion=${UMBRACO_MAJOR} --no-build
    - name: Pack integration
      run: >-
        dotnet pack Integrations.Umbraco.csproj
        --configuration Release /p:Version=${VERSION} /p:UmbracoMajorVersion=${UMBRACO_MAJOR} --no-build --output .
    - name: Pack Search
      if: env.UMBRACO_MAJOR == '19'
      run: >-
        dotnet pack ../Integrations.Umbraco.Search/Integrations.Umbraco.Search.csproj
        --configuration Release /p:Version=${VERSION} --no-build --output .
    - name: Log in to NuGet.org
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: bhk.relewise

    - name: Push
      run: |
        dotnet nuget push Relewise.Integrations.Umbraco.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        if [ "${UMBRACO_MAJOR}" = "19" ]; then
          dotnet nuget push Relewise.Integrations.Umbraco.Search.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${NUGET_TOKEN}
        fi
      env:
        NUGET_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
